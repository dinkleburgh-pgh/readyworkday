services:
  truckapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dinkleburgh-pgh/readyworkday:v1.7.3
    container_name: truckapp
    working_dir: /app
    ports:
      - "${HOST_PORT:-8501}:8501"
    environment:
      APP_FILE: ${APP_FILE:-app_unloadv1.7.py}
      APP_VERSION: "1.7.3"
      APP_BUILD: "19"
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      TRUCKAPP_AUTH_COOKIE_NAME: ${TRUCKAPP_AUTH_COOKIE_NAME:-truckapp_auth}
      TRUCKAPP_AUTH_COOKIE_KEY: ${TRUCKAPP_AUTH_COOKIE_KEY:-truckapp_cookie_key_change_me_please_override_with_random_32_plus_chars}
      TRUCKAPP_AUTH_COOKIE_DAYS: ${TRUCKAPP_AUTH_COOKIE_DAYS:-7}
      TRUCKAPP_STATE_FILE: /app/data/.truck_state.json
      TRUCKAPP_FLEET_FILE: /app/data/truck_fleet.json
      TRUCKAPP_DURATIONS_FILE: /app/data/load_durations.json
      TRUCKAPP_OFF_SCHEDULE_DEFAULTS_FILE: /app/data/off_schedule_defaults.json
      TRUCKAPP_HISTORY_DIR: /app/data/state_history
      TRUCKAPP_AUTH_USERS_FILE: /app/data/auth_users.json
      TRUCKAPP_AUTH_REQUESTS_FILE: /app/data/auth_user_requests.json
      TRUCKAPP_COMMUNICATIONS_FILE: /app/data/communications_chat.json
      TRUCKAPP_AUDIT_HISTORY_FILE: /app/data/audit_requests.json
    volumes:
      - ./:/app
      - ${TRUCKAPP_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
