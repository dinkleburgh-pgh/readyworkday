<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>TruckApp Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --bg-accent: #172554;
        --card: rgba(15, 23, 42, 0.9);
        --card-border: rgba(147, 197, 253, 0.2);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #93c5fd;
      }
      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: "Aptos", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(59, 130, 246, 0.28), transparent 42%),
          radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.18), transparent 36%),
          linear-gradient(180deg, var(--bg-accent), var(--bg));
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--text);
        padding:
          max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      main {
        max-width: 32rem;
        width: min(32rem, 100%);
        margin: 0;
        padding: 1.35rem 1.45rem;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(2, 6, 23, 0.34);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 0.55rem;
        font-size: 1.35rem;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
        padding: 0.4rem 0.72rem;
        border-radius: 999px;
        border: 1px solid rgba(147, 197, 253, 0.28);
        background: rgba(15, 23, 42, 0.7);
        color: var(--accent);
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .status-pill::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(147, 197, 253, 0.75);
      }
      @media (max-width: 640px) {
        main {
          padding: 1.15rem 1.1rem;
          border-radius: 16px;
        }
        h1 {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status-pill">Offline Mode</div>
      <h1>TruckApp is offline</h1>
      <p>
        Your device is currently offline. Reconnect to the network and reopen TruckApp
        to continue live scheduling updates.
      </p>
    </main>
  </body>
</html>
