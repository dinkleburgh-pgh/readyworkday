<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TruckApp Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #dbeafe, var(--bg) 55%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--text);
      }
      main {
        max-width: 32rem;
        margin: 1rem;
        padding: 1.25rem 1.4rem;
        background: var(--card);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.1);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TruckApp is offline</h1>
      <p>
        Your device is currently offline. Reconnect to the network and reopen TruckApp
        to continue live scheduling updates.
      </p>
    </main>
  </body>
</html>
